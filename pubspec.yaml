name: one_calendar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0-beta.47+47

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  dio: ^5.9.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  path_drawing: ^1.0.1
  window_manager: ^0.5.1
  connectivity_plus: ^6.0.3
  flutter_background_service: ^5.0.7
  flutter_local_notifications: ^17.2.1
  package_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
